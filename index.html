<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Simple App</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }
    textarea {
      width: 100%;
      height: 300px;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h2>📝 My First Web App</h2>

  <textarea id="note" placeholder="Write something..."></textarea>

  <br>
  <button onclick="saveNote()">Save</button>
  <button onclick="loadNote()">Load</button>

  <script>
    function saveNote() {
      let text = document.getElementById("note").value;
      localStorage.setItem("myNote", text);
      alert("Saved!");
    }

    function loadNote() {
      let text = localStorage.getItem("myNote");
      document.getElementById("note").value = text || "";
    }

    // 自动加载
    loadNote();
  </script>

</body>
</html>
