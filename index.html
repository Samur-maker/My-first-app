<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes App</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Arial;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 300px;
      border: none;
      outline: none;
      font-size: 16px;
      resize: none;
      padding: 10px;
      border-radius: 12px;
      background: #f7f8fa;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    .save {
      background: #2563eb;
      color: white;
    }

    .load {
      background: #e5e7eb;
    }

    button:active {
      transform: scale(0.98);
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">
  <div class="card">
    <h1>📝 My Notes</h1>

    <textarea id="note" placeholder="Start writing..."></textarea>

    <div class="buttons">
      <button class="save" onclick="saveNote()">Save</button>
      <button class="load" onclick="loadNote()">Load</button>
    </div>

    <div class="hint">Saved locally in your browser</div>
  </div>
</div>

<script>
  function saveNote() {
    let text = document.getElementById("note").value;
    localStorage.setItem("myNote", text);
  }

  function loadNote() {
    let text = localStorage.getItem("myNote");
    document.getElementById("note").value = text || "";
  }

  loadNote();
</script>

</body>
</html>
